name: LWM Fuel Filter source contract

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: lwms-fuel-filter-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate metadata, Harmony target contracts and committed DLL
        run: python3 -m unittest discover -s Tests -p test_source_contract.py -v
